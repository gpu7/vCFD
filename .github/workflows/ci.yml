# Minimal CI + dependency hygiene for public PRs
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Python setup
        run: uv python install 3.12

      - name: Sync and test
        run: |
          uv sync --group dev
          uv run pytest -q

      - name: Ruff check
        run: uv run ruff check src tests
